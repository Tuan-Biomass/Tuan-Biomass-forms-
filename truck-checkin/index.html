<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>Tuan Biomass — Truck Driver Check-In</title>

<link rel="icon" type="image/png" href="icon-signin.png">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  --green:#2D6A4F;
  --green-dark:#1B4332;
  --danger:#DC2626;
  --bg:#F6F7F8;
  --card:#fff;
  --border:#D1D5DB;
  --muted:#6B7280;
  --text:#111827;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  min-height:100%;
}

body{
  font-family:"Barlow",sans-serif;
  background:var(--bg);
  color:var(--text);
}

.site-header{
  background:#fff;
  color:var(--green-dark);
  padding:14px 22px;
  display:flex;
  align-items:center;
  gap:14px;
  border-bottom:3px solid var(--green);
  box-shadow:0 2px 6px rgba(0,0,0,.06);
}

.site-header h1{
  font-family:"Barlow Condensed",sans-serif;
  font-weight:700;
  font-size:16px;
  color:var(--green-dark);
}

.site-header p{
  font-size:13px;
  color:var(--muted);
  margin-top:2px;
}

.wrap{
  width:100%;
  max-width:560px;
  margin:0 auto;
  padding:24px 14px 60px;
}

.card{
  background:var(--card);
  border-radius:14px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  padding:26px;
  min-height:calc(100vh - 170px);
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.title{
  font-family:"Barlow Condensed",sans-serif;
  font-weight:700;
  font-size:26px;
  color:var(--green-dark);
  line-height:1.15;
  text-align:center;
}

.sub{
  font-size:15px;
  color:var(--muted);
  margin-top:8px;
  text-align:center;
}

.pin-wrap{
  margin:34px 0 8px;
  display:flex;
  justify-content:center;
}

.pin-boxes{
  display:flex;
  gap:14px;
}

.pin-box{
  width:64px;
  height:76px;
  font-family:"Barlow Condensed",sans-serif;
  font-size:40px;
  text-align:center;
  border:2px solid var(--border);
  border-radius:14px;
  color:var(--green-dark);
  background:#fff;
}

.pin-box:focus{
  outline:none;
  border-color:var(--green);
}

.pin-box.filled{
  border-color:var(--green);
  background:#F0FDF4;
}

.hint{
  font-size:13px;
  color:var(--muted);
  text-align:center;
  margin-top:6px;
}

.btn{
  border-radius:10px;
  font-family:"Barlow Condensed",sans-serif;
  font-weight:700;
  font-size:16px;
  letter-spacing:.4px;
  cursor:pointer;
  border:none;
  transition:.15s;
  padding:14px 18px;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  white-space:nowrap;
  width:100%;
}

.btn-primary{
  background:var(--green);
  color:#fff;
}

.btn-primary:hover{
  background:var(--green-dark);
}

.btn-secondary{
  background:#EEF2F7;
  color:var(--green-dark);
  border:1px solid var(--border);
}

.actions{
  margin-top:22px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.hidden{
  display:none!important;
}

.spinner{
  width:44px;
  height:44px;
  border:4px solid #E5E7EB;
  border-top-color:var(--green);
  border-radius:50%;
  margin:0 auto 18px;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.welcome-name{
  font-family:"Barlow Condensed",sans-serif;
  font-weight:800;
  font-size:30px;
  color:var(--green-dark);
  text-align:center;
}

.welcome-company{
  font-size:15px;
  color:var(--muted);
  text-align:center;
  margin-top:4px;
}

.status-box{
  border-radius:12px;
  padding:18px;
  margin:20px 0;
  font-size:15px;
  line-height:1.5;
  text-align:center;
}

.status-ok{
  background:#F0FDF4;
  border:1px solid #86EFAC;
  color:#166534;
}

.status-warn{
  background:#FFFBEB;
  border:1px solid #FACC15;
  color:#713F12;
}

.status-danger{
  background:#FEF2F2;
  border:1px solid #FCA5A5;
  color:#991B1B;
}

.match-list{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:16px;
}

.match-opt{
  border:1.5px solid var(--border);
  border-radius:10px;
  padding:14px;
  text-align:left;
  background:#fff;
  cursor:pointer;
  font-family:"Barlow",sans-serif;
  font-size:16px;
  color:var(--text);
}

.match-opt:hover{
  border-color:var(--green);
  background:#F0FDF4;
}

.footer{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  margin-top:18px;
}

@media(max-width:420px){

  .pin-box{
    width:52px;
    height:64px;
    font-size:32px;
  }

  .pin-boxes{
    gap:10px;
  }

  .card{
    padding:18px;
  }
}

</style>
</head>


<body>

<header class="site-header">

  <img
    src="/images/Albioma-Logo.jpg"
    alt="Albioma"
    style="height:38px;width:auto;"
    onerror="this.style.display='none'"
  >

  <div>
    <h1>Tuan Biomass</h1>
    <p>Truck Driver Check-In</p>
  </div>

</header>


<main class="wrap">


<section class="card" id="pageEntry">

  <div class="title">
    Truck Driver Check-In
  </div>

  <div class="sub">
    Enter your 4-digit code to check in
  </div>


  <div class="pin-wrap">

    <div class="pin-boxes" id="pinBoxes">

      <input
        type="tel"
        class="pin-box"
        maxlength="1"
        inputmode="numeric"
        autocomplete="off"
        data-index="0"
      >

      <input
        type="tel"
        class="pin-box"
        maxlength="1"
        inputmode="numeric"
        autocomplete="off"
        data-index="1"
      >

      <input
        type="tel"
        class="pin-box"
        maxlength="1"
        inputmode="numeric"
        autocomplete="off"
        data-index="2"
      >

      <input
        type="tel"
        class="pin-box"
        maxlength="1"
        inputmode="numeric"
        autocomplete="off"
        data-index="3"
      >

    </div>

  </div>


  <div class="hint" id="entryHint">
    Your code is the last 4 digits of your mobile number
  </div>

</section>



<section class="card hidden" id="pageResult">

  <div id="resultChecking">

    <div class="spinner"></div>

    <div class="sub" style="margin-top:0">
      Checking your details...
    </div>

  </div>


  <div id="resultBody" class="hidden">

    <div class="welcome-name" id="welcomeName"></div>

    <div class="welcome-company" id="welcomeCompany"></div>

    <div id="statusBox"></div>

    <div id="matchList" class="match-list hidden"></div>

    <div class="actions" id="resultActions"></div>

  </div>

</section>



<div class="footer">
  VR-002-2026-v1.0 · Tuan Biomass Truck Check-In · Albioma
</div>


</main>


<script>

/* =========================================================
   ROUTES
========================================================= */

const CONFIG = {

  checkURL:
    "/api/truck-driver-check",

  checkInURL:
    "/api/truck-check-in"

};


/* =========================================================
   TRUCK VISIT SETTINGS
========================================================= */

const ASSUMED_DURATION_MINUTES = 33;


/* =========================================================
   CURRENT DRIVER
========================================================= */

let currentDriver = null;


/* =========================================================
   DATE / TIME
========================================================= */

function todayISO(){

  const n = new Date();

  const p = x =>
    String(x).padStart(2,"0");

  return `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`;

}


function timeNow(){

  const n = new Date();

  const p = x =>
    String(x).padStart(2,"0");

  return `${p(n.getHours())}:${p(n.getMinutes())}`;

}


function estimatedDepartureTime(minutesToAdd){

  const n =
    new Date(
      Date.now() +
      minutesToAdd * 60000
    );

  const p = x =>
    String(x).padStart(2,"0");

  return `${p(n.getHours())}:${p(n.getMinutes())}`;

}


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(str){

  return String(str || "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m])
    );

}


function stripFormulaChars(key,value){

  if(
    typeof value === "string" &&
    /^[=+\-@]/.test(value)
  ){
    return "'" + value;
  }

  return value;

}


/* =========================================================
   EXPIRED DOCUMENT NAMES
========================================================= */

function getExpiredDocumentNames(rawDocs){

  if(!rawDocs){
    return [];
  }

  try{

    let docs = rawDocs;

    if(typeof docs === "string"){
      docs = JSON.parse(docs);
    }

    if(!Array.isArray(docs)){
      return [];
    }

    return docs
      .map(doc => {

        if(typeof doc === "string"){
          return doc.trim();
        }

        if(doc && doc.document_type){
          return String(doc.document_type).trim();
        }

        if(doc && doc["Insurance Type"]){
          return String(doc["Insurance Type"]).trim();
        }

        if(doc && typeof doc === "object"){
          const values = Object.values(doc).filter(Boolean);

          if(values.length){
            return String(values[0]).trim();
          }
        }

        return "";

      })
      .filter(Boolean);

  }catch(e){

    console.warn(
      "Could not read expired document details:",
      e
    );

    return [];

  }

}


/* =========================================================
   PIN ENTRY
========================================================= */

function pinBoxes(){

  return [
    ...document.querySelectorAll(".pin-box")
  ];

}


function initPinBoxes(){

  const boxes = pinBoxes();


  boxes.forEach((box,i) => {


    box.addEventListener("input",() => {

      box.value =
        box.value
          .replace(/\D/g,"")
          .slice(0,1);

      box.classList.toggle(
        "filled",
        !!box.value
      );


      if(
        box.value &&
        i < boxes.length - 1
      ){
        boxes[i+1].focus();
      }


      maybeAutoSubmit();

    });


    box.addEventListener("keydown",e => {

      if(
        e.key === "Backspace" &&
        !box.value &&
        i > 0
      ){
        boxes[i-1].focus();
      }

    });


    box.addEventListener("paste",e => {

      e.preventDefault();


      const digits =
        (
          e.clipboardData.getData("text") || ""
        )
        .replace(/\D/g,"")
        .slice(0,4)
        .split("");


      boxes.forEach((b,j) => {

        b.value =
          digits[j] || "";

        b.classList.toggle(
          "filled",
          !!b.value
        );

      });


      const last =
        boxes[
          Math.min(
            digits.length,
            4
          ) - 1
        ];


      if(last){
        last.focus();
      }


      maybeAutoSubmit();

    });

  });


  boxes[0].focus();

}


function maybeAutoSubmit(){

  const code =
    pinBoxes()
      .map(b => b.value)
      .join("");


  if(code.length === 4){

    pinBoxes()
      .forEach(
        b => b.blur()
      );

    runCheck(code);

  }

}


window.addEventListener(
  "DOMContentLoaded",
  initPinBoxes
);


/* =========================================================
   RESET
========================================================= */

function resetToEntry(){

  currentDriver = null;


  document
    .getElementById("pageResult")
    .classList
    .add("hidden");


  document
    .getElementById("pageEntry")
    .classList
    .remove("hidden");


  const boxes =
    pinBoxes();


  boxes.forEach(b => {

    b.value = "";

    b.classList
      .remove("filled");

  });


  document
    .getElementById("entryHint")
    .textContent =
      "Your code is the last 4 digits of your mobile number";


  setTimeout(
    () => boxes[0].focus(),
    50
  );

}


/* =========================================================
   DRIVER LOOKUP
========================================================= */

async function runCheck(code){

  document
    .getElementById("pageEntry")
    .classList
    .add("hidden");


  document
    .getElementById("pageResult")
    .classList
    .remove("hidden");


  document
    .getElementById("resultChecking")
    .classList
    .remove("hidden");


  document
    .getElementById("resultBody")
    .classList
    .add("hidden");


  let data;


  try{

    const res =
      await fetch(
        CONFIG.checkURL,
        {

          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:
            JSON.stringify(
              {

                mobile_last4:
                  code,

                date:
                  todayISO(),

                arrival_time:
                  timeNow()

              },
              stripFormulaChars
            )

        }
      );


    if(!res.ok){

      throw new Error(
        `HTTP ${res.status}`
      );

    }


    data =
      await res.json();


  }catch(e){

    showNoMatch(
      `We couldn't reach the check-in system. DEBUG: ${
        e && e.message
          ? e.message
          : e
      }`
    );

    return;

  }


  if(
    Array.isArray(data.matches) &&
    data.matches.length > 1
  ){

    showMultipleMatches(
      data.matches,
      code
    );

    return;

  }


  if(!data.full_name){

    showNoMatch(
      "No truck driver record was found for that code."
    );

    return;

  }


  currentDriver = {

    code:
      code,

    full_name:
      data.full_name,

    company:
      data.company || "",

    person_id:
      data.person_id || code

  };


  showWelcome(data);

}


/* =========================================================
   DUPLICATE PIN
========================================================= */

function showMultipleMatches(matches,code){

  document
    .getElementById("resultChecking")
    .classList
    .add("hidden");


  document
    .getElementById("resultBody")
    .classList
    .remove("hidden");


  document
    .getElementById("welcomeName")
    .textContent =
      "Which driver are you?";


  document
    .getElementById("welcomeCompany")
    .textContent =
      "More than one driver matches that code";


  document
    .getElementById("statusBox")
    .innerHTML = "";


  const list =
    document
      .getElementById("matchList");


  list.classList
    .remove("hidden");


  list.innerHTML =
    matches
      .map(
        (m,i) =>
          `<button
            class="match-opt"
            onclick="selectMatch(${i})"
          >
            ${escapeHTML(m.full_name)}
            —
            ${escapeHTML(m.company || "")}
          </button>`
      )
      .join("");


  window._pendingMatches =
    matches;

  window._pendingCode =
    code;


  document
    .getElementById("resultActions")
    .innerHTML =
      `<button
        class="btn btn-secondary"
        onclick="resetToEntry()"
      >
        Not me — start over
      </button>`;

}


function selectMatch(i){

  const m =
    window._pendingMatches[i];


  currentDriver = {

    code:
      window._pendingCode,

    full_name:
      m.full_name,

    company:
      m.company || "",

    person_id:
      m.person_id ||
      window._pendingCode

  };


  document
    .getElementById("matchList")
    .classList
    .add("hidden");


  showWelcome(m);

}


/* =========================================================
   NO MATCH
========================================================= */

function showNoMatch(reason){

  document
    .getElementById("resultChecking")
    .classList
    .add("hidden");


  document
    .getElementById("resultBody")
    .classList
    .remove("hidden");


  document
    .getElementById("welcomeName")
    .textContent =
      "Driver not found";


  document
    .getElementById("welcomeCompany")
    .textContent = "";


  document
    .getElementById("matchList")
    .classList
    .add("hidden");


  document
    .getElementById("statusBox")
    .innerHTML =
      `<div class="status-box status-danger">
        ${escapeHTML(reason)}
        Please see the site office or operators.
      </div>`;


  document
    .getElementById("resultActions")
    .innerHTML =
      `<button
        class="btn btn-secondary"
        onclick="resetToEntry()"
      >
        Try a different code
      </button>`;

}


/* =========================================================
   DRIVER STATUS
========================================================= */

function showWelcome(data){

  document
    .getElementById("resultChecking")
    .classList
    .add("hidden");


  document
    .getElementById("resultBody")
    .classList
    .remove("hidden");


  document
    .getElementById("matchList")
    .classList
    .add("hidden");


  document
    .getElementById("welcomeName")
    .textContent =
      `Welcome, ${data.full_name}`;


  document
    .getElementById("welcomeCompany")
    .textContent =
      data.company || "";


  const inducted =
    data.inducted !== false;


  const docsExpired =
    data.docs_expired === true ||
    String(data.docs_expired).toLowerCase() === "true";


  const expiredDocumentNames =
    getExpiredDocumentNames(
      data.expired_docs
    );


/* =========================================================
   INDUCTION EXPIRED
========================================================= */

  if(!inducted){

    document
      .getElementById("statusBox")
      .innerHTML =
        `<div class="status-box status-warn">
          You're checked in, however your site induction has expired
          or hasn't been completed.
          Please see the site office or operators before continuing work on site.
        </div>`;


    document
      .getElementById("resultActions")
      .innerHTML =
        `<button
          class="btn btn-secondary"
          onclick="resetToEntry()"
        >
          Done
        </button>`;


    logCheckIn(
      "induction_expired"
    );


    return;

  }


/* =========================================================
   INSURANCE / LICENCE DETAILS EXPIRED
========================================================= */

  if(docsExpired){

    let documentMessage =
      "Your company's insurance or licence details require updating.";

    if(expiredDocumentNames.length === 1){

      documentMessage =
        `${escapeHTML(expiredDocumentNames[0])} requires updating.`;

    }

    if(expiredDocumentNames.length > 1){

      documentMessage =
        `The following details require updating: <strong>${
          expiredDocumentNames
            .map(name => escapeHTML(name))
            .join(", ")
        }</strong>.`;

    }


    document
      .getElementById("statusBox")
      .innerHTML =
        `<div class="status-box status-warn">
          <strong>You're checked in.</strong>
          <br><br>
          ${documentMessage}
          <br><br>
          Your company has been notified and asked to provide current details.
          <br><br>
          Please see the site office or operators if required.
        </div>`;


    document
      .getElementById("resultActions")
      .innerHTML =
        `<button
          class="btn btn-primary"
          onclick="resetToEntry()"
        >
          Done
        </button>`;


    logCheckIn(
      "documents_expired"
    );


    return;

  }


/* =========================================================
   ALL CLEAR
========================================================= */

  document
    .getElementById("statusBox")
    .innerHTML =
      `<div class="status-box status-ok">
        You're checked in and all clear.
        Head to site safely.
      </div>`;


  document
    .getElementById("resultActions")
    .innerHTML =
      `<button
        class="btn btn-primary"
        onclick="resetToEntry()"
      >
        Done
      </button>`;


  logCheckIn(
    "clear"
  );

}


/* =========================================================
   LOG CHECK-IN
========================================================= */

async function logCheckIn(outcome){

  if(!currentDriver){
    return;
  }


  try{

    const res =
      await fetch(
        CONFIG.checkInURL,
        {

          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:
            JSON.stringify(
              {

                type:
                  "truck_check_in",

                person_id:
                  currentDriver.person_id,

                mobile_last4:
                  currentDriver.code,

                full_name:
                  currentDriver.full_name,

                company:
                  currentDriver.company,

                date:
                  todayISO(),

                arrival_time:
                  timeNow(),

                assumed_duration_minutes:
                  ASSUMED_DURATION_MINUTES,

                estimated_departure_time:
                  estimatedDepartureTime(
                    ASSUMED_DURATION_MINUTES
                  ),

                outcome:
                  outcome

              },
              stripFormulaChars
            )

        }
      );


    if(!res.ok){

      console.warn(
        "Truck check-in returned HTTP",
        res.status
      );

    }


  }catch(e){

    console.warn(
      "Truck check-in log error:",
      e
    );

  }

}

</script>

<footer style="text-align:center;font-size:12px;color:#6b7280;padding:16px 12px 26px;border-top:1px solid #e5e7eb;margin-top:20px;"><a href="/privacy-policy.html" style="color:#1B4332;">Privacy &amp; Data Collection Policy</a></footer>
</body>
</html>
