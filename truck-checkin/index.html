<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>Tuan Biomass — Truck Driver Check-In</title>

<link rel="icon" type="image/png" href="icon-signin.png">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  --green:#2D6A4F;
  --green-dark:#1B4332;
  --danger:#DC2626;
  --bg:#F6F7F8;
  --card:#fff;
  --border:#D1D5DB;
  --muted:#6B7280;
  --text:#111827;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  min-height:100%;
}

body{
  font-family:"Barlow",sans-serif;
  background:var(--bg);
  color:var(--text);
}

.site-header{
  background:#fff;
  color:var(--green-dark);
  padding:14px 22px;
  display:flex;
  align-items:center;
  gap:14px;
  border-bottom:3px solid var(--green);
  box-shadow:0 2px 6px rgba(0,0,0,.06);
}

.site-header h1{
  font-family:"Barlow Condensed",sans-serif;
  font-weight:700;
  font-size:16px;
  color:var(--green-dark);
}

.site-header p{
  font-size:13px;
  color:var(--muted);
  margin-top:2px;
}

.wrap{
  width:100%;
  max-width:560px;
  margin:0 auto;
  padding:24px 14px 60px;
}

.card{
  background:var(--card);
  border-radius:14px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  padding:26px;
  min-height:calc(100vh - 170px);
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.title{
  font-family:"Barlow Condensed",sans-serif;
  font-weight:700;
  font-size:26px;
  color:var(--green-dark);
  line-height:1.15;
  text-align:center;
}

.sub{
  font-size:15px;
  color:var(--muted);
  margin-top:8px;
  text-align:center;
}

.pin-wrap{
  margin:34px 0 8px;
  display:flex;
  justify-content:center;
}

.pin-boxes{
  display:flex;
  gap:14px;
}

.pin-box{
  width:64px;
  height:76px;
  font-family:"Barlow Condensed",sans-serif;
  font-size:40px;
  text-align:center;
  border:2px solid var(--border);
  border-radius:14px;
  color:var(--green-dark);
  background:#fff;
}

.pin-box:focus{
  outline:none;
  border-color:var(--green);
}

.pin-box.filled{
  border-color:var(--green);
  background:#F0FDF4;
}

.hint{
  font-size:13px;
  color:var(--muted);
  text-align:center;
  margin-top:6px;
}

.btn{
  border-radius:10px;
  font-family:"Barlow Condensed",sans-serif;
  font-weight:700;
  font-size:16px;
  letter-spacing:.4px;
  cursor:pointer;
  border:none;
  transition:.15s;
  padding:14px 18px;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  white-space:nowrap;
  width:100%;
}

.btn-primary{
  background:var(--green);
  color:#fff;
}

.btn-primary:hover{
  background:var(--green-dark);
}

.btn-secondary{
  background:#EEF2F7;
  color:var(--green-dark);
  border:1px solid var(--border);
}

.actions{
  margin-top:22px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.hidden{
  display:none!important;
}

.spinner{
  width:44px;
  height:44px;
  border:4px solid #E5E7EB;
  border-top-color:var(--green);
  border-radius:50%;
  margin:0 auto 18px;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.welcome-name{
  font-family:"Barlow Condensed",sans-serif;
  font-weight:800;
  font-size:30px;
  color:var(--green-dark);
  text-align:center;
}

.welcome-company{
  font-size:15px;
  color:var(--muted);
  text-align:center;
  margin-top:4px;
}

.status-box{
  border-radius:12px;
  padding:18px;
  margin:20px 0;
  font-size:15px;
  line-height:1.5;
  text-align:center;
}

.status-ok{
  background:#F0FDF4;
  border:1px solid #86EFAC;
  color:#166534;
}

.status-warn{
  background:#FFFBEB;
  border:1px solid #FACC15;
  color:#713F12;
}

.status-danger{
  background:#FEF2F2;
  border:1px solid #FCA5A5;
  color:#991B1B;
}

.match-list{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:16px;
}

.match-opt{
  border:1.5px solid var(--border);
  border-radius:10px;
  padding:14px;
  text-align:left;
  background:#fff;
  cursor:pointer;
  font-family:"Barlow",sans-serif;
  font-size:16px;
  color:var(--text);
}

.match-opt:hover{
  border-color:var(--green);
  background:#F0FDF4;
}

.footer{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  margin-top:18px;
}

@media(max-width:420px){

  .pin-box{
    width:52px;
    height:64px;
    font-size:32px;
  }

  .pin-boxes{
    gap:10px;
  }

  .card{
    padding:18px;
  }
}

</style>
</head>


<body>

<header class="site-header">

  <img
    src="/images/Albioma-Logo.jpg"
    alt="Albioma"
    style="height:38px;width:auto;"
    data-csp-hook="cspHook1"
  >

  <div>
    <h1>Tuan Biomass</h1>
    <p>Truck Driver Check-In</p>
  </div>

</header>


<main class="wrap">


<section class="card" id="pageEntry">

  <div class="title">
    Truck Driver Check-In
  </div>

  <div class="sub">
    Enter your 4-digit code to check in
  </div>


  <div class="pin-wrap">

    <div class="pin-boxes" id="pinBoxes">

      <input
        type="tel"
        class="pin-box"
        maxlength="1"
        inputmode="numeric"
        autocomplete="off"
        data-index="0"
      >

      <input
        type="tel"
        class="pin-box"
        maxlength="1"
        inputmode="numeric"
        autocomplete="off"
        data-index="1"
      >

      <input
        type="tel"
        class="pin-box"
        maxlength="1"
        inputmode="numeric"
        autocomplete="off"
        data-index="2"
      >

      <input
        type="tel"
        class="pin-box"
        maxlength="1"
        inputmode="numeric"
        autocomplete="off"
        data-index="3"
      >

    </div>

  </div>


  <div class="hint" id="entryHint">
    Your code is the last 4 digits of your mobile number
  </div>

</section>



<section class="card hidden" id="pageResult">

  <div id="resultChecking">

    <div class="spinner"></div>

    <div class="sub" style="margin-top:0">
      Checking your details...
    </div>

  </div>


  <div id="resultBody" class="hidden">

    <div class="welcome-name" id="welcomeName"></div>

    <div class="welcome-company" id="welcomeCompany"></div>

    <div id="statusBox"></div>

    <div id="matchList" class="match-list hidden"></div>

    <div class="actions" id="resultActions"></div>

  </div>

</section>



<div class="footer">
  VR-002-2026-v1.0 · Tuan Biomass Truck Check-In · Albioma
</div>


</main>




<footer style="text-align:center;font-size:12px;color:#6b7280;padding:16px 12px 26px;border-top:1px solid #e5e7eb;margin-top:20px;"><a href="/privacy-policy.html" style="color:#1B4332;">Privacy &amp; Data Collection Policy</a></footer>
<script src="/truck-checkin/script.js"></script>
</body>
</html>
